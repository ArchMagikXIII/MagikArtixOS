# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here
# CachyOS repos ship the kernel and desktop defaults this system is
# built around; their mirrorlist file comes from the cachyos-mirrorlist
# package in the default set.
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# The linux-omarchy kernel in the package set resolves from the Omarchy
# repository until pkgs.magikos.org is live.
[omarchy]
SigLevel = Optional TrustAll
Server = https://pkgs.omarchy.org/stable/$arch

# The Magikos package repository activates when pkgs.magikos.org goes
# live; keep these lines for magikos-version-channel detection.
#[magikos]
# SigLevel = Optional TrustAll
# Server = https://pkgs.magikos.org/stable/$arch
